name: Check and bundle game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse game scripts
        run: node tools/check.cjs
      - name: Build offline HTML
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: offline-game-html
          path: dist/*.html
